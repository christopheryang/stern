name: PR Agent

# Automated AI code review (PR-Agent, open source, Apache-2.0:
# github.com/The-PR-Agent/pr-agent), self-hosted in Actions with our
# own model key. Reviews, describes, and suggests improvements on new
# pull requests; /review, /improve, /ask, and /describe also work as
# PR comments. Requires the OPENAI_KEY repository secret.
#
# Trigger guards (this workflow runs from the default branch with the
# secret and write permissions, on a public repo): slash commands are
# honored only on pull requests, only from comments starting with '/',
# and only from the owner, members, or collaborators — an arbitrary
# commenter must not be able to spend the OPENAI_KEY. Fork pull
# requests never receive the secret, so they are skipped entirely.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/') &&
      (github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR'))) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Run PR Agent
    steps:
      - name: PR Agent action step
        id: pragent
        uses: The-PR-Agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b # v0.50.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
