name: Quality Check - Pull Request

# Runs on EVERY pull request (opened, updated, reopened), with no path
# filters. The per-area workflows (core-quality-check.yml,
# desktop-quality-check.yml) only fire when their paths change, and the
# WASM frontend is otherwise only built at release time — this workflow
# is the always-on gate that closes those gaps.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege for every job in this workflow (CodeQL
# actions/missing-workflow-permissions): all jobs only read the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            libssl-dev \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  clippy-wasm-ui:
    name: Clippy (stern-ui, wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy for the WASM target the UI ships as
        run: cargo clippy -p stern-ui --target wasm32-unknown-unknown -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            libssl-dev \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run core tests
        run: cargo test --manifest-path core/stern-core/Cargo.toml --all-targets

      - name: Run IPC tests
        run: cargo test --manifest-path core/stern-ipc/Cargo.toml --all-targets

      - name: Run Tauri tests
        run: cargo test --manifest-path desktop/stern-tauri/Cargo.toml --all-targets

  frontend:
    name: Frontend build (Trunk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Build frontend
        run: cd desktop/stern-app && trunk build --release

  cargo-audit:
    name: Cargo audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@1c009442a2e6d2f0b3839e122123f418ae963a1e # cargo-audit
        with:
          tool: cargo-audit

      # Cache the RustSec advisory database between runs: cargo audit
      # otherwise clones it fresh on every PR.
      - name: Cache the RustSec advisory database
        uses: actions/cache@v4
        with:
          path: ~/.cargo/advisory-db
          key: cargo-advisory-db

      - name: Audit dependencies against the RustSec advisory database
        run: cargo audit

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the pull request history for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
