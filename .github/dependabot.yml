version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # precommit-check.yml validates Conventional Commits messages, so
    # Dependabot's default "Bump ..." subjects would fail the gate.
    commit-message:
      prefix: "chore(deps)"
    # Batch minor/patch bumps into one PR; majors stay individual so
    # breaking changes get their own review.
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # glib 0.20.0 (the fix for GHSA-wrw7-89jp-8q8g, alert #1) is
      # unreachable: Tauri's Linux GTK3 stack (gtk 0.18) pins glib to
      # 0.18.x, so every Dependabot security-update attempt fails with
      # security_update_not_possible. A versions-based ignore is
      # honored by security updates too, so this stops the doomed
      # attempts; the alert itself stays open as the reminder. Remove
      # this once the GTK stack can move to glib >= 0.20.
      - dependency-name: "glib"
        versions: [">= 0.20.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
