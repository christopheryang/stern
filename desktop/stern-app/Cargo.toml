[package]
name = "stern-app"
version.workspace = true
license.workspace = true
edition = "2021"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["HtmlElement", "Element", "Window", "Document"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
stern-ui = { path = "../stern-ui" }
stern-ipc = { path = "../../core/stern-ipc" }
thiserror = "2"
zeroize = "1"

[lints]
workspace = true
