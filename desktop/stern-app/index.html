<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <title>Stern</title>
        <script>
            // Apply a saved dark choice before first paint, so there is no light flash.
            try {
                if (localStorage.getItem("stern-theme") === "dark") {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            } catch (e) {}
        </script>
        <link data-trunk rel="css" href="../stern-ui/styles/stern.css" />
        <link data-trunk rel="copy-file" href="../stern-ui/assets/stern-logo.svg" />
        <link data-trunk rel="copy-file" href="../stern-ui/assets/stern-logo-dark.svg" />
        <link data-trunk rel="copy-file" href="../stern-ui/assets/stern-mark.svg" />
        <link data-trunk rel="icon" href="../stern-ui/assets/stern-icon.svg" />
        <link data-trunk rel="rust" data-wasm-opt="z" />
    </head>
    <body></body>
</html>
