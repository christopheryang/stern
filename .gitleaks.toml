# Gitleaks configuration.
#
# The default rules stay in force. The one allowlist below covers
# the model catalog's SHA-256 integrity pins: those hashes are
# public values (they identify public model and tokenizer files
# so downloads can be verified), not secrets — but the
# generic-api-key rule reads `tokenizer_sha256: "<hex>"` as a
# credential assignment.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "Model catalog SHA-256 integrity pins (public hashes, not secrets)"
condition = "AND"
regexTarget = "line"
regexes = ['''tokenizer_sha256: "[0-9a-f]{64}"''']
paths = ['''core/stern-core/src/ai/model_manager\.rs''']
