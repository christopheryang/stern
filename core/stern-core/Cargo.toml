[package]
name = "stern-core"
version.workspace = true
license.workspace = true
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "3", features = ["serde"] }
async-trait = "0.1"
rusqlite = { version = "0.43", features = ["bundled"] }

chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
aes = "0.9"
aes-kw = "0.3"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
secrecy = { version = "0.10", features = ["serde"] }
subtle = "2"
rand = "0.8"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"
tracing = { version = "0.1", features = ["attributes"] }
arboard = { version = "3", default-features = false }
indexmap = { version = "2", features = ["serde"] }
region = "4"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt", "sync", "time", "macros"] }
# ONNX Runtime is NOT linked into the binary: `load-dynamic` makes ort
# dlopen the runtime library at first use, and the library itself is
# downloaded on demand with the first model (see ai::model_manager).
# The app therefore ships with no ONNX code or model at all.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "api-24", "load-dynamic", "half"] }
# Wheel (ZIP) extraction for the runtime download is hand-rolled in
# ai::model_manager (stored/deflate entries only, over an archive whose
# SHA-256 was verified first); flate2 supplies just the deflate codec.
flate2 = "1"
tokenizers = "0.22"
ureq = "3"
ndarray = "0.17"
data-encoding = "2"

[dependencies.sea-orm]
version = "2.0"
default-features = false
features = ["sqlx-sqlite", "runtime-tokio", "macros", "sqlite-use-returning-for-3_35"]

[dependencies.sea-orm-migration]
version = "2.0"
default-features = false
features = ["runtime-tokio", "sqlx-sqlite", "sqlite-use-returning-for-3_35", "with-chrono"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "time"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
